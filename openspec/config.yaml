schema: spec-driven

context: |
  Tech stack: Next.js 16 App Router + React 19 + TypeScript 5 + Sanity + Clerk.
  Package manager: pnpm (lockfile: pnpm-lock.yaml).
  Architecture: app/ routes with domain/ and lib/ modules.
  Testing: no test runner configured; lint and type-check only.
  Style: ESLint 9 (next/core-web-vitals + next/typescript), strict TS.

strict_tdd: false

testing:
  detected_at: "2026-05-24"
  runner:
    available: false
    command: ""
    framework: ""
  layers:
    unit:
      available: false
      tool: ""
    integration:
      available: false
      tool: ""
    e2e:
      available: false
      tool: ""
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: true
      command: "pnpm lint"
    type_checker:
      available: true
      command: "pnpm lint:types"
    formatter:
      available: false
      command: ""

rules:
  proposal:
    - Include rollback plan for risky migrations.
    - State Sanity hotspot/crop impact on existing image rendering.
  specs:
    - Use Given/When/Then scenarios.
    - Use RFC 2119 keywords (MUST/SHOULD/MAY).
  design:
    - Document image URL builder decisions and fallback behavior.
    - Keep Next.js Server/Client boundaries explicit.
  tasks:
    - Group by phase and keep tasks reviewable.
    - Respect review_budget_lines: 400 and chained_pr_strategy: ask-always.
  apply:
    tdd: false
    test_command: ""
    lint_command: "pnpm lint"
    typecheck_command: "pnpm lint:types"
    build_command: "pnpm build"
  verify:
    test_command: ""
    lint_command: "pnpm lint"
    typecheck_command: "pnpm lint:types"
    build_command: "pnpm build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
