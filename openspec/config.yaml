rules:
  proposal:
    - Include scope, non-goals, user-visible impact, and rollback plan for risky changes.
  specs:
    - Use Given/When/Then scenarios and RFC 2119 keywords.
    - Keep behavior requirements independent from implementation details.
  design:
    - Document data flow across Next.js, Sanity, Clerk, and Stripe when touched.
    - Call out Server Component vs Client Component boundaries explicitly.
  tasks:
    - Group tasks into small reviewable work units; default guard is 400 changed lines.
    - Keep tests or verification with the behavior they validate.
  apply:
    tdd: false
    test_command: null
    quality_commands:
      - pnpm lint
      - pnpm lint:types
      - pnpm build
    notes:
      - User handles commits manually; do not commit, push, or create PRs.
  verify:
    test_command: null
    build_command: pnpm build
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas into main specs.
